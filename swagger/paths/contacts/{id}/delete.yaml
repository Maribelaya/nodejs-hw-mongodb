tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: 'Delete a contact by ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '64f1d8a5b7c3a12a34bc5678'
responses:
  '200':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact deleted successfully
  '404':
    $ref: '../../../components/responses/404.yaml'
