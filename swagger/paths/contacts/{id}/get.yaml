tags:
  - Contacts
summary: Get contact by id
operationId: getContact
description: 'Get contact information by contact ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '64f1d8a5b7c3a12a34bc5678'
responses:
  '200':
    description: Successfully found contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact found successfully
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
