tags:
  - Contacts
summary: Get all contacts with pagination and sorting
operationId: getContacts
description: Retrieve a paginated list of contacts with optional sorting
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number for pagination
    schema:
      type: integer
      minimum: 1
      example: 1
  - in: query
    name: perPage
    description: Number of contacts per page
    schema:
      type: integer
      minimum: 1
      maximum: 100
      example: 10
  - in: query
    name: sortOrder
    description: Order of sorting
    schema:
      type: string
      enum: [asc, desc]
      example: desc
  - in: query
    name: sortBy
    description: Field to sort by
    schema:
      type: string
      enum: [name, email, favorite]
      example: name
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - page
            - perPage
            - total
            - totalPages
            - data
          properties:
            status:
              type: integer
              example: 200
            page:
              type: integer
              example: 1
            perPage:
              type: integer
              example: 10
            total:
              type: integer
              example: 45
            totalPages:
              type: integer
              example: 5
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
