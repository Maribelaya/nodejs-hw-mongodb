type: object
required:
  - _id
  - name
  - email
  - phone
properties:
  _id:
    type: string
    example: '64f1d8a5b7c3a12a34bc5678'
    description: Contact ID
  name:
    type: string
    example: 'Jane Doe'
    description: Contact name
  email:
    type: string
    example: 'jane.doe@example.com'
    description: Contact email
  phone:
    type: string
    example: '+380123456789'
    description: Contact phone
